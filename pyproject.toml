[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "clean-databricks"
version = "0.1.0"
description = "Analyze and safely remove stale resources from a Databricks account."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [
    { name = "szetumer" },
]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]
dependencies = [
    "click>=8.1",
    "db-convo-pkg[databricks] @ git+https://github.com/szetumer/db_convo.git@1c6420d7f3de3ecef3a98ff75d404f61232c2b68",
    "matplotlib>=3.10",
    "networkx>=3.4",
    "openpyxl>=3.1",
    "python-dotenv>=1.1",
    "sqlglot>=27",
]

[project.scripts]
clean-databricks = "clean_databricks.cli:cli"

[project.optional-dependencies]
dev = [
    "mypy>=1.15",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.11",
    "types-networkx>=3.4",
    "types-openpyxl>=3.1",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
clean_databricks = ["py.typed"]
"clean_databricks.sql_diagnostics" = ["*.sql"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers"
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["clean_databricks"]

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["clean_databricks"]

[tool.ruff]
target-version = "py311"
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

